<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Psi(a/c, beta) Interactive</title>
<script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>
<style>
body{font-family:Arial;margin:30px}
.controls{margin:15px 0}
#layout{display:flex;gap:30px;align-items:flex-start}
#crackWrap{flex:0 0 240px}
#plot{flex:1;height:700px}
svg text{font-family:Arial}
</style>
</head>
<body>

<h2>Interactive ψ(a/c, β) for Elliptical Crack</h2>

<div class="controls">
  β = <span id="betaVal">0</span>°
  <input type="range" id="beta" min="0" max="90" value="0" step="1" style="width:600px">
</div>

<div id="layout">

  <div id="crackWrap">
    <svg id="crackSvg" viewBox="0 0 220 260" width="220" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="ah" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
          <path d="M0,0 L7,3.5 L0,7 Z" fill="#444"/>
        </marker>
        <marker id="ahRed" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
          <path d="M0,0 L7,3.5 L0,7 Z" fill="#e05"/>
        </marker>
      </defs>

      <line x1="110" y1="8"   x2="110" y2="235" stroke="#444" stroke-width="1" marker-end="url(#ah)"/>
      <line x1="8"   y1="130" x2="212" y2="130" stroke="#444" stroke-width="1" marker-end="url(#ah)"/>
      <text x="115" y="16"  font-size="13" fill="#444" font-style="italic">Z</text>
      <text x="205" y="128" font-size="13" fill="#444" font-style="italic">X</text>

      <ellipse cx="110" cy="130" rx="78" ry="100" fill="none" stroke="#222" stroke-width="2"/>

      <line x1="110" y1="130" x2="110" y2="30" stroke="#1a6bb5" stroke-width="1.2" stroke-dasharray="5,3"/>
      <text x="118" y="76" font-size="13" fill="#1a6bb5" font-style="italic">a</text>

      <line x1="110" y1="130" x2="188" y2="130" stroke="#1a6bb5" stroke-width="1.2" stroke-dasharray="5,3"/>
      <text x="148" y="124" font-size="13" fill="#1a6bb5" font-style="italic">c</text>

      <line id="betaArrow" x1="110" y1="130" x2="188" y2="130"
            stroke="#e05" stroke-width="2.2" marker-end="url(#ahRed)"/>
      <path id="betaArc" d="" fill="none" stroke="#e05" stroke-width="1.3"/>
      <text id="betaTxt" x="140" y="122" font-size="13" fill="#e05" font-style="italic">β</text>
    </svg>
  </div>

  <div id="plot"></div>

</div>

<script>

function ellipe(m){
  const N=2000, h=(Math.PI/2)/N;
  let sum=0;
  for(let i=0;i<=N;i++){
    const phi=i*h;
    const f=Math.sqrt(1-m*Math.sin(phi)**2);
    let w=2;
    if(i===0||i===N) w=1;
    else if(i%2===1) w=4;
    sum+=w*f;
  }
  return sum*h/3;
}

function E_ac(x){
  if(x>=1){ let m=1-1/(x*x); return ellipe(m); }
  let m=1-x*x; return (1/x)*ellipe(m);
}

function psi(x,betaDeg){
  const beta=betaDeg*Math.PI/180;
  const num=Math.sqrt(Math.cos(beta)**2+(1/(x*x))*Math.sin(beta)**2);
  return Math.sqrt(Math.PI)*num/E_ac(x);
}

function compute(beta){
  let xs=[], ys=[];
  for(let x=0.05;x<=4;x+=0.02){ xs.push(x); ys.push(psi(x,beta)); }
  return {xs,ys};
}

function updateArrow(betaDeg){
  const beta=betaDeg*Math.PI/180;
  const cx=110, cy=130, R=70;
  const ex=cx+R*Math.cos(-beta);
  const ey=cy+R*Math.sin(-beta);
  document.getElementById('betaArrow').setAttribute('x2',ex.toFixed(1));
  document.getElementById('betaArrow').setAttribute('y2',ey.toFixed(1));

  const arcR=26;
  const sx=cx+arcR, sy=cy;
  const ax=cx+arcR*Math.cos(-beta), ay=cy+arcR*Math.sin(-beta);
  if(betaDeg<1){
    document.getElementById('betaArc').setAttribute('d','');
  } else {
    document.getElementById('betaArc').setAttribute('d',
      `M ${sx.toFixed(1)} ${sy.toFixed(1)} A ${arcR} ${arcR} 0 0 0 ${ax.toFixed(1)} ${ay.toFixed(1)}`);
  }
  const lx=cx+38*Math.cos(-beta/2);
  const ly=cy+38*Math.sin(-beta/2)-3;
  document.getElementById('betaTxt').setAttribute('x',lx.toFixed(1));
  document.getElementById('betaTxt').setAttribute('y',ly.toFixed(1));
}

var layout={
  xaxis:{title:'Axial ratio a/c', range:[0,4]},
  yaxis:{title:'ψ(a/c, β)',       range:[0,2.5]},
  showlegend:false,
  margin:{t:20,r:20,b:60,l:60}
};

function draw(beta){
  document.getElementById('betaVal').innerText=beta;
  const d=compute(beta);
  Plotly.newPlot('plot',[
    {x:d.xs, y:d.ys, mode:'lines', line:{width:4, color:'#1f77b4'}},
    {x:[1,1], y:[0,2.5], mode:'lines', line:{dash:'dash', color:'gray', width:1.5}},
    {x:[0,4], y:[Math.sqrt(Math.PI),Math.sqrt(Math.PI)], mode:'lines',
     line:{dash:'dot', color:'gray', width:1.5},
     text:['','π^(1/2)'], textposition:'top right', mode:'lines+text'},
    {x:[0,4], y:[2/Math.sqrt(Math.PI),2/Math.sqrt(Math.PI)], mode:'lines',
     line:{dash:'dot', color:'gray', width:1.5}}
  ], layout);
  updateArrow(beta);
}

draw(0);

document.getElementById('beta').addEventListener('input', e=>draw(Number(e.target.value)));

</script>
</body>
</html>

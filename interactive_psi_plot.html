
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Psi(a/c, beta) Interactive</title>
<script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>
<style>
body{font-family:Arial;margin:30px}
#plot{width:100%;height:700px}
.controls{margin:15px 0}
</style>
</head>
<body>

<h2>Interactive ψ(a/c, β) for Elliptical Crack</h2>

<div class="controls">
β = <span id="betaVal">0</span>°
<input type="range" id="beta" min="0" max="90" value="0" step="1" style="width:600px">
</div>

<div id="plot"></div>

<script>

function ellipe(m){
    const N=2000;
    const h=(Math.PI/2)/N;

    let sum=0;

    for(let i=0;i<=N;i++){

        const phi=i*h;

        const f=Math.sqrt(
            1-m*Math.sin(phi)**2
        );

        let w=2;

        if(i===0 || i===N) w=1;
        else if(i%2===1) w=4;

        sum+=w*f;
    }

    return sum*h/3;
}

function E_ac(x){

    if(x>=1){
        let m=1-1/(x*x);
        return ellipe(m);
    }

    let m=1-x*x;

    return (1/x)*ellipe(m);
}

function psi(x,betaDeg){

    const beta=betaDeg*Math.PI/180;

    const num=Math.sqrt(
        Math.cos(beta)**2
        +(1/(x*x))*Math.sin(beta)**2
    );

    return Math.sqrt(Math.PI)*num/E_ac(x);
}

function compute(beta){

    let xs=[];
    let ys=[];

    for(let x=0.05;x<=4;x+=0.02){

        xs.push(x);
        ys.push(
            psi(x,beta)
        );
    }

    return {xs,ys};
}

function draw(beta){

    document.getElementById(
        "betaVal"
    ).innerText=beta;

    const d=compute(beta);

    Plotly.newPlot(
        "plot",
        [
        {
            x:d.xs,
            y:d.ys,
            mode:"lines",
            line:{width:4}
        },
        {
            x:[1,1],
            y:[0,2.5],
            mode:"lines",
            line:{dash:"dash"}
        },
        {
            x:[0,4],
            y:[Math.sqrt(Math.PI),Math.sqrt(Math.PI)],
            mode:"lines",
            line:{dash:"dot"}
        },
        {
            x:[0,4],
            y:[2/Math.sqrt(Math.PI),2/Math.sqrt(Math.PI)],
            mode:"lines",
            line:{dash:"dot"}
        }
        ],
        {
            xaxis:{
                title:"Axial ratio a/c",
                range:[0,4]
            },
            yaxis:{
                title:"ψ(a/c,β)",
                range:[0,2.5]
            }
        }
    );
}

draw(0);

document.getElementById("beta")
.addEventListener(
"input",
e=>draw(
Number(e.target.value)
)
);

</script>

</body>
</html>
